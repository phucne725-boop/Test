
name: Build EcoChill JAR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Create Gradle files
        run: |
          echo "rootProject.name = 'EcoChill'" > settings.gradle

          cat > build.gradle <<'EOF'
          plugins {
              id 'java'
          }

          group = 'com.ecochill'
          version = '1.0.0'

          repositories {
              mavenCentral()
              maven {
                  url = 'https://repo.papermc.io/repository/maven-public/'
              }
          }

          dependencies {
              compileOnly 'io.papermc.paper:paper-api:26.3.build.244-stable'
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(25)
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EcoChill-JAR
          path: build/libs/*.jar
          if-no-files-found: error
