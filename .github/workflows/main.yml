
name: Build PHUT CITY

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Khong tim thay ZIP"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Fix Paper API version
        run: |
          echo "Tim cac khai bao Paper API cu..."

          grep -RIl \
            --exclude-dir=.git \
            '26.3-R0.1-SNAPSHOT' extracted \
            | while IFS= read -r FILE; do
                echo "Sua: $FILE"
                sed -i 's/26.3-R0.1-SNAPSHOT/26.3.build.+/g' "$FILE"
              done

          echo "Kiem tra khai bao cu..."
          if grep -RIn '26.3-R0.1-SNAPSHOT' extracted; then
            echo "ERROR: Van con phien ban Paper API cu"
            exit 1
          fi

      - name: Find Gradle project
        run: |
          BUILD_FILE=$(find extracted -type f \( \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Khong tim thay build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Build PHUT CITY
        run: |
          gradle -p "$PROJECT_DIR" clean build --no-daemon

      - name: Check JAR
        run: |
          find "$PROJECT_DIR/build/libs" -type f -name '*.jar'

          if ! find "$PROJECT_DIR/build/libs" -type f -name '*.jar' | grep -q .; then
            echo "ERROR: Khong tao duoc JAR"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PHUT-CITY-1.0
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
