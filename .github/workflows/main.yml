
name: Build Phut SMP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find and Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Không tìm thấy file ZIP!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find source
        run: |
          BUILD_FILE=$(find extracted -name build.gradle | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Không tìm thấy build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          test -f "$PROJECT_DIR/src/main/java/vn/phutsmp/PhutSmp.java"
          test -f "$PROJECT_DIR/src/main/resources/plugin.yml"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: gradle -p "$PROJECT_DIR" clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PhutSmp-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
