
name: PSSMP Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check source files
        shell: bash
        run: |
          if ! find . -name "*.java" -not -path "*/target/*" | grep -q .; then
            echo "::error::Repository chưa có mã nguồn Java."
            exit 1
          fi

      - name: Create temporary Maven configuration
        shell: bash
        run: |
          mkdir -p src/main/java src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>

            <groupId>vn.pssmp</groupId>
            <artifactId>pssmp-core</artifactId>
            <version>1.0</version>

            <properties>
              <maven.compiler.release>25</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>26.1.2-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>

              <dependency>
                <groupId>com.zaxxer</groupId>
                <artifactId>HikariCP</artifactId>
                <version>6.3.0</version>
              </dependency>
            </dependencies>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.1</version>
                </plugin>

                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-shade-plugin</artifactId>
                  <version>3.6.0</version>
                  <executions>
                    <execution>
                      <phase>package</phase>
                      <goals>
                        <goal>shade</goal>
                      </goals>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

      - name: Prepare source and resources
        shell: bash
        run: |
          if [ -d src/main/java ]; then
            find . -maxdepth 1 -type f -name "*.java" \
              -exec cp {} src/main/java/ \;
          fi

          if [ -f plugin.yml ]; then
            cp plugin.yml src/main/resources/
          fi

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PSSMP-JAR
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
