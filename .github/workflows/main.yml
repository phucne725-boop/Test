
name: Build PHUT CITY 1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy source.zip"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Gradle project
        run: |
          BUILD_FILE=$(find extracted -type f -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "Không tìm thấy build.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build PHUT CITY
        run: gradle -p "$PROJECT_DIR" clean build --no-daemon

      - name: Check JAR
        run: |
          find "$PROJECT_DIR/build/libs" -type f -name '*.jar'
          if ! find "$PROJECT_DIR/build/libs" -type f -name '*.jar' | grep -q .; then
            echo "Không tạo được JAR"
            exit 1
          fi

      - name: Upload PHUT CITY
        uses: actions/upload-artifact@v4
        with:
          name: PHUT-CITY-1.0
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
