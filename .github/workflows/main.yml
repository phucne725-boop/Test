
name: Build PHUT CITY

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn từ repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài Java 25
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Cài Gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      # 4. Tìm và giải nén ZIP
      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Khong tim thay file ZIP"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "Da giai nen: $ZIP"

      # 5. Tìm dự án Gradle và sửa phiên bản Paper API
      - name: Prepare Gradle project
        run: |
          BUILD_FILE=$(find extracted -type f \( \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: ZIP khong co build.gradle"
            exit 1
          fi

          echo "Gradle file: $BUILD_FILE"

          sed -i 's/26.3-R0.1-SNAPSHOT/26.3.build.+/g' "$BUILD_FILE"

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Biên dịch plugin
      - name: Build PHUT CITY
        run: |
          gradle -p "$PROJECT_DIR" clean build --no-daemon

      # 7. Kiểm tra JAR
      - name: Check generated JAR
        run: |
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar'

          if ! find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' | grep -q .; then
            echo "ERROR: Khong tao duoc file JAR"
            exit 1
          fi

      # 8. Đưa JAR lên Artifacts
      - name: Upload PHUT CITY JAR
        uses: actions/upload-artifact@v4
        with:
          name: PHUT-CITY-1.0
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
