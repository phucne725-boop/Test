
name: PSSMP Maven Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Maven project
        id: project
        shell: bash
        run: |
          POM=$(find . -name pom.xml -not -path '*/.git/*' -print -quit)

          if [ -z "$POM" ]; then
            echo "::error::Khong tim thay pom.xml. Hay upload ma nguon Java PSSMP vao Repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $PROJECT_DIR"

      - name: Build with Maven
        run: mvn -B -f "${{ steps.project.outputs.dir }}/pom.xml" clean package -DskipTests

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: PSSMP-Build
          path: |
            **/target/*.jar
            !**/target/original-*.jar
          if-no-files-found: error
          retention-days: 30
