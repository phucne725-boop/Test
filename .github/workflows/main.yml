
name: Build PHUT CITY

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy source ZIP"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Find and build project
        run: |
          BUILD_FILE=$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "ZIP không có build.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          gradle -p "$PROJECT_DIR" clean build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PHUT-CITY-1.0
          path: extracted/**/build/libs/*.jar

