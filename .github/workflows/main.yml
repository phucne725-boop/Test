
name: Build Phut SMP from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q PhutSmp_CODE_v1.0.zip -d extracted
          ls -R extracted

      - name: Verify source
        run: |
          test -f extracted/PhutSmp/build.gradle
          test -f extracted/PhutSmp/src/main/java/vn/phutsmp/PhutSmp.java
          test -f extracted/PhutSmp/src/main/resources/plugin.yml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: gradle -p extracted/PhutSmp clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PhutSmp-JAR
          path: extracted/PhutSmp/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
