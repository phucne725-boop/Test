
name: Build Phut SMP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Phut SMP
        run: gradle clean build --no-daemon

      - name: Upload PhutSmp JAR
        uses: actions/upload-artifact@v4
        with:
          name: PhutSmp-JAR
          path: build/libs/PhutSmp-*.jar
          if-no-files-found: error
          retention-days: 14
