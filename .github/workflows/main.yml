
name: Build Phut SMP

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhutSmp_CODE_v1.1.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q PhutSmp_CODE_v1.1.zip -d extracted

      - name: Verify files
        run: |
          test -f extracted/build.gradle
          test -f extracted/src/main/java/vn/phutsmp/PhutSmp.java
          test -f extracted/src/main/resources/plugin.yml

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle -p extracted clean build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PhutSmp-JAR
          path: extracted/build/libs/*.jar
          if-no-files-found: error
